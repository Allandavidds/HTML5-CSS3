<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: rgba(173, 216, 230, 0.623);
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            /*ShortHand= Border: 10px 10px 10px 10px (Observar a ordem cima,direita,abaixo,esquerda)*/

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            /*ShortHand= Padding: 10px 10px 10px 10px (Observar a ordem cima,direita,abaixo,esquerda) */

            outline-width: 5px;
            outline-style: dashed;
            outline-color: blue;
        }

        /* ShortHand para as configurações acima
        Border: 10px solid darkslategray;
        padding: 10px;
        margin: 20px auto 40px auto;
        outline: 5px dashed blue;
        */

        a {
           border-width: 10px;
           border-style: solid;
           border-color: red;
           
           padding-top: 10px;
           padding-right: 10px;
           padding-bottom: 10px;
           padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa Box-Level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>.Vamos ver como tudo isso funciona.</p>
    
</body>
</html>
